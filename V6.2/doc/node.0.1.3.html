<H2>
2.4&nbsp;Local definitions
</H2>


In addition to the destructuring <TT>let</TT> (see section
<A HREF="node.0.1.1.html#Letin">2.2.3</A>), there is a possibility to define local terms inside a
bigger term.
There is currently two syntax for that:<BR><BR>
<BR>

<TABLE CELLSPACING=2 CELLPADDING=0>
<TR><TD NOWRAP ALIGN=left>
term</TD>
<TD NOWRAP ALIGN=center>::=</TD>
<TD NOWRAP ALIGN=left><TT>let</TT> ident <TT>=</TT> term <TT>in</TT> term</TD>
</TR>

<TR><TD NOWRAP ALIGN=left>&nbsp;</TD>
<TD NOWRAP ALIGN=center>|</TD>
<TD NOWRAP ALIGN=left><TT>[</TT> ident <TT>=</TT> term <TT>]</TT> term</TD>
</TR>
</TABLE>

<BR>
<BR><BR>
Both are synonymous.<BR><BR>
