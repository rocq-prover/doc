<H2>

2.4&nbsp;Local definitions
</H2>



<A NAME="@default67"></A>In addition to the destructuring <TT>let</TT> (see section
<A HREF="node.0.1.1.html#Letin">2.2.3</A>), there is a possibility to define local terms inside a
bigger term.
There are currently two equivalent syntaxes for that:<BR>
<BR>
<BR>
<TABLE CELLSPACING=2 CELLPADDING=0>
<TR><TD NOWRAP ALIGN=left><I><FONT COLOR=maroon>term</FONT></I></TD>
<TD NOWRAP ALIGN=center>::=</TD>
<TD NOWRAP ALIGN=left><TT>let</TT> <I><FONT COLOR=maroon>ident</FONT></I> <TT>=</TT> <I><FONT COLOR=maroon>term</FONT></I> <TT>in</TT> <I><FONT COLOR=maroon>term</FONT></I></TD>
</TR>
<TR><TD NOWRAP ALIGN=left>&nbsp;</TD>
<TD NOWRAP ALIGN=center>|</TD>
<TD NOWRAP ALIGN=left><TT>[</TT> <I><FONT COLOR=maroon>ident</FONT></I> <TT>=</TT> <I><FONT COLOR=maroon>term</FONT></I> <TT>]</TT> <I><FONT COLOR=maroon>term</FONT></I>
</TD>
</TR></TABLE>
