<H2>

4.6&nbsp;Coinductive types
</H2>

types inhabited by infinite objects.

in&nbsp;[<CITE><A HREF="#Gimenez95b"><CITE>55</CITE></A>, </CITE><CITE><A HREF="#Gim98"><CITE>56</CITE></A></CITE>].<BR>
